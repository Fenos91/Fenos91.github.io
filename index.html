<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Лабиринт Дэнди?.. для ес беар</title>
<style>
@font-face {
font-family: 'GameFont';
src: url('font.ttf') format('opentype');
}

:root {
--ui-scale: 1;
--slot-size: 40px;
}

body, html {
margin: 0; padding: 0; width: 100%; height: 100%;
background-color: #000; overflow: hidden;
font-family: 'GameFont', monospace; user-select: none; color: white;
cursor: default;
}

#game-container {
position: absolute; top: 50%; left: 50%;
transform: translate(-50%, -50%);
width: 100vw; max-width: calc(100vh * (4/3));
height: 100vh; max-height: calc(100vw * (3/4));
background: #050505; position: relative;
overflow: hidden;
transition: max-width 0.3s, max-height 0.3s;
}

#game-container.aspect-16-9 {
max-width: calc(100vh * (16/9));
max-height: calc(100vw * (9/16));
}

canvas {
width: 100%; height: 100%; display: block;
image-rendering: pixelated;
}

.screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; background: rgba(0,0,0,0.85); z-index: 100; }
.hidden { display: none !important; }

h1 { font-size: calc(32px * var(--ui-scale)); color: red; text-shadow: 2px 2px 0 #000; user-select: none; margin: 10px 0; }
h2 { font-size: calc(22px * var(--ui-scale)); color: #ffaa00; margin: 10px 0 5px 0; display: flex; align-items: center; justify-content: space-between; width: 100%; }
label { font-size: calc(16px * var(--ui-scale)); margin-top: 5px; }
button { background: #333; color: white; border: 2px solid #555; padding: calc(10px * var(--ui-scale)) calc(18px * var(--ui-scale)); margin: 5px; font-family: 'GameFont', monospace; font-size: calc(14px * var(--ui-scale)); cursor: pointer; text-transform: uppercase; }
button:hover { background: #555; }
input[type="range"], select, input[type="number"] { margin: 5px; width: calc(180px * var(--ui-scale)); background: #222; color: #fff; border: 1px solid #555; font-family: 'GameFont', monospace; }

.btn-reset { font-size: 10px; padding: 2px 6px; border: 1px solid #777; background: #442222; margin-left: 10px; }
.btn-reset:hover { background: #663333; }

#hud { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
#key-counter { position: absolute; top: calc(20px * var(--ui-scale)); left: calc(20px * var(--ui-scale)); font-size: calc(24px * var(--ui-scale)); }

.top-right-hud { position: absolute; top: calc(20px * var(--ui-scale)); right: calc(20px * var(--ui-scale)); display: flex; align-items: flex-start; pointer-events: none; }
#pause-btn { pointer-events: auto; padding: calc(5px * var(--ui-scale)) calc(10px * var(--ui-scale)); font-size: calc(16px * var(--ui-scale)); background: #222; margin-right: calc(15px * var(--ui-scale)); margin-top: 0; margin-left: 0; }

#inventory-container { display: flex; flex-direction: column; align-items: flex-end; pointer-events: auto; }
#inventory { display: flex; gap: calc(3px * var(--ui-scale)); flex-wrap: wrap; max-width: calc(45vw * var(--ui-scale)); max-height: calc(50vh * var(--ui-scale)); justify-content: flex-end; align-content: flex-start; overflow-y: auto; }
.slot { width: calc(var(--slot-size) * var(--ui-scale)); height: calc(var(--slot-size) * var(--ui-scale)); border: 2px solid #555; background: rgba(0,0,0,0.5); display: flex; justify-content: center; align-items: center; pointer-events: auto; cursor: pointer; flex-shrink: 0; }
.slot.active { border-color: red; background: rgba(50,0,0,0.8); }
.slot img { width: 80%; height: 80%; object-fit: contain; pointer-events: none; }
#item-name { margin-top: calc(5px * var(--ui-scale)); font-size: calc(16px * var(--ui-scale)); color: white; text-align: right; min-height: calc(20px * var(--ui-scale)); }

#stamina-bar-container { position: absolute; bottom: calc(20px * var(--ui-scale)); left: calc(20px * var(--ui-scale)); width: calc(200px * var(--ui-scale)); height: calc(16px * var(--ui-scale)); border: 2px solid #fff; background: rgba(0,0,0,0.5); }
#stamina-bar { width: 100%; height: 100%; background: #00ff00; transition: width 0.1s linear, background-color 0.3s; }

#message { position: absolute; bottom: calc(80px * var(--ui-scale)); left: 50%; transform: translateX(-50%); font-size: calc(24px * var(--ui-scale)); color: yellow; text-align: center; }

#black-screen { position: absolute; top:0; left:0; width:100%; height:100%; background:black; z-index: 999; display: none; transition: opacity 0.3s; }

#mobile-controls { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 20; display: none; }
.touch-btn { position: absolute; background: rgba(255,255,255,0.2); border: 2px solid rgba(255,255,255,0.5); border-radius: 50%; color: white; display: flex; justify-content: center; align-items: center; pointer-events: auto; font-size: calc(12px * var(--ui-scale)); text-align: center; }
.touch-btn:active { background: rgba(255,255,255,0.5); }

#joystick-zone { position: absolute; bottom: calc(20px * var(--ui-scale)); left: calc(20px * var(--ui-scale)); width: calc(120px * var(--ui-scale)); height: calc(120px * var(--ui-scale)); background: rgba(255,255,255,0.1); border-radius: 50%; pointer-events: auto; }
#joystick-knob { position: absolute; top: 50%; left: 50%; width: calc(48px * var(--ui-scale)); height: calc(48px * var(--ui-scale)); background: rgba(255,255,255,0.5); border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; }

#btn-grab { bottom: calc(20px * var(--ui-scale)); right: calc(100px * var(--ui-scale)); width: calc(64px * var(--ui-scale)); height: calc(64px * var(--ui-scale)); }
#btn-use { bottom: calc(95px * var(--ui-scale)); right: calc(100px * var(--ui-scale)); width: calc(48px * var(--ui-scale)); height: calc(48px * var(--ui-scale)); }
#btn-run { bottom: calc(20px * var(--ui-scale)); right: calc(20px * var(--ui-scale)); width: calc(64px * var(--ui-scale)); height: calc(64px * var(--ui-scale)); }
#btn-lookback { bottom: calc(95px * var(--ui-scale)); right: calc(20px * var(--ui-scale)); width: calc(48px * var(--ui-scale)); height: calc(48px * var(--ui-scale)); }

#end-video { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1000; object-fit: cover; background: black; pointer-events: auto; }

/* Панель администратора */
#admin-screen {
padding: 20px; box-sizing: border-box; overflow-y: auto; justify-content: flex-start;
z-index: 200; background: rgba(10, 10, 15, 0.95);
}
.admin-grid {
display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; width: 95%; max-width: 800px;
}
.admin-box {
background: #1a1a24; border: 1px solid #333344; padding: 10px; border-radius: 4px; display: flex; flex-direction: column; align-items: center;
}
.admin-box label { font-size: 13px; color: #aaa; }
</style>
</head>

<script src="three.min.js"></script>
<script>
fetch('info.txt')
    .then(response => response.text())
    .then(text => document.getElementById('warning-text').value = text)
    .catch(err => document.getElementById('warning-text').value = "Не удалось загрузить info.txt. Убедитесь, что файл существует.");

document.getElementById('continue-btn').onclick = () => {
    document.getElementById('warning-screen').classList.add('hidden');
    document.getElementById('menu-screen').classList.remove('hidden');
};

let scene, camera, renderer, clock, raycaster;
let mazeGrid = [], mazeSize = 60;
let cellSize = 4, wallHeight = 4;
let gameState = 'menu';

let player = { speed: 3.5, runMult: 1.8, stam: 150, maxStam: 150, stamDrain: 20, stamRegen: 10 };
let velocity = new THREE.Vector3(), direction = new THREE.Vector3();
let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false, isRunning = false, isLookingBack = false;
let lookBackOffset = 0;

let keys = 0, maxKeys = 16;
let inv = [null, null, null, null, null], activeSlot = 0;
let itemNames = { 'chocolate': 'Шоколад', 'slime': 'Слайм', 'key': 'Ключ', 'hammer': 'Молоток', 'secret button': 'Секретная кнопка', 'bonbon': 'Бонбон' };
let infiniteStamTime = 0; 
let bonbonActive = false; 
let colliders = [], items = [], slimes = [];
let globalTextures = {};
let guaranteedItemCells = []; 

let instancedWalls, wallData = [], brokenWalls = [];
let exitMesh, dirArrow;

let monster;
let monsterActive = false;
let monsterKnockback = new THREE.Vector3();
let dandyKnockback = new THREE.Vector3();
let monsterPathTimer = 0;
let monsterTargetPos = new THREE.Vector3();
let monsterWanderTarget = null; 
let dandyTargetPos = new THREE.Vector3();

let dandyMesh, dandyAudio, dandyTextures = [], listener, bgMusic;
let lampa = { mesh: null, state: 'dead', audio1: null, audio2: null, hasAudio2: true, targetPos: new THREE.Vector3(), bonbonGiven: false };

const audioFiles = ['1.mp3', '2.mp3', '3.mp3', '4.mp3', '5.mp3', '6.ogg', '7.ogg', '8.ogg', '9.ogg', '10.ogg', '11.ogg', '12.mp3', '13.ogg', '14.ogg'];

let sensitivity = 1.0;
let euler = new THREE.Euler(0, 0, 0, 'YXZ');
const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
let joyMove = { x: 0, y: 0 };
let fogEnabled = true;
let pixelated = true;

let godModeActive = false;
let noClipActive = false;
let flyActive = false;
let espMonster = false, espDandy = false, espLampa = false;
let blackMonsterSpeed = 2.0; 
let dandySpeedVal = 3.4;
let is169Aspect = false;

function snapToNearestEmpty(pos) {
    let offset = (mazeSize * cellSize) / 2;
    let cx = Math.floor((pos.x + offset) / cellSize);
    let cz = Math.floor((pos.z + offset) / cellSize);
    cx = Math.max(1, Math.min(mazeSize - 2, cx));
    cz = Math.max(1, Math.min(mazeSize - 2, cz));
    
    if(mazeGrid[cx] && mazeGrid[cx][cz] === 0) {
        pos.x = cx * cellSize - offset + cellSize/2;
        pos.z = cz * cellSize - offset + cellSize/2;
        return;
    }
    for(let r=1; r<10; r++) {
        for(let i=-r; i<=r; i++) {
            for(let j=-r; j<=r; j++) {
                let nx=cx+i, nz=cz+j;
                if(nx>0 && nx<mazeSize-1 && nz>0 && nz<mazeSize-1 && mazeGrid[nx] && mazeGrid[nx][nz]===0) {
                    pos.x = nx * cellSize - offset + cellSize/2;
                    pos.z = nz * cellSize - offset + cellSize/2;
                    return;
                }
            }
        }
    }
}

function init() {
const container = document.getElementById('game-container');
scene = new THREE.Scene();
scene.background = new THREE.Color(0x050505);
scene.fog = new THREE.FogExp2(0x050505, 0.08);

camera = new THREE.PerspectiveCamera(75, 4/3, 0.1, 100);
raycaster = new THREE.Raycaster();

listener = new THREE.AudioListener();
camera.add(listener);

bgMusic = new THREE.Audio(listener);
new THREE.AudioLoader().load('audio/background.ogg', function(buffer) {
bgMusic.setBuffer(buffer);
bgMusic.setLoop(true); 
bgMusic.setVolume(1.0);
if (gameState === 'playing') bgMusic.play();
});

renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setSize(container.clientWidth / 2, container.clientHeight / 2, false);
renderer.domElement.style.width = '100%';
renderer.domElement.style.height = '100%';
container.appendChild(renderer.domElement);

clock = new THREE.Clock();

const floorGeo = new THREE.PlaneGeometry(mazeSize * cellSize, mazeSize * cellSize);
const floorMat = new THREE.MeshBasicMaterial({ color: 0x111111 });
const floor = new THREE.Mesh(floorGeo, floorMat);
floor.rotation.x = -Math.PI / 2;
scene.add(floor);

const ceil = new THREE.Mesh(floorGeo, new THREE.MeshBasicMaterial({ color: 0x080808 }));
ceil.rotation.x = Math.PI / 2;
ceil.position.y = wallHeight;
scene.add(ceil);

let tLoader = new THREE.TextureLoader();
for(let i=1; i<=20; i++) {
dandyTextures.push(tLoader.load(`images/dandy/dandy (${i}).png`));
}

dandyAudio = new THREE.PositionalAudio(listener);
let audioLoader = new THREE.AudioLoader();
audioLoader.load('audio/dandy.ogg', function(buffer) {
dandyAudio.setBuffer(buffer); dandyAudio.setRefDistance(3); dandyAudio.setLoop(true); dandyAudio.setVolume(1.0);
});

generateMaze();
spawnItems();
initMonster();
initLampa();
setupInput();
setupAdminPanel();
updateInventoryUI();

setInterval(() => {
if (gameState === 'playing' && Math.random() < 0.2) {
let sound = new THREE.Audio(listener);
new THREE.AudioLoader().load('audio/' + audioFiles[Math.floor(Math.random() * audioFiles.length)], function(buffer) {
sound.setBuffer(buffer);
sound.setVolume(0.5);
sound.play();
});
}
}, 10000);

window.addEventListener('resize', resizeSlots);
requestAnimationFrame(animate);
}

function generateMaze() {
for (let i = 0; i < mazeSize; i++) {
mazeGrid[i] = [];
for (let j = 0; j < mazeSize; j++) mazeGrid[i][j] = 1;
}

let startX = Math.floor(mazeSize/2); if(startX%2===0) startX++;
let startY = Math.floor(mazeSize/2); if(startY%2===0) startY++;

mazeGrid[startX][startY] = 0;
let x = startX, y = startY;

for(let step=0; step < mazeSize*mazeSize*4; step++) {
let dirs = [[0,1],[1,0],[0,-1],[-1,0]];
let dir = dirs[Math.floor(Math.random()*4)];
let nx = x + dir[0]*2, ny = y + dir[1]*2;
if(nx > 1 && nx < mazeSize-2 && ny > 1 && ny < mazeSize-2) {
if (mazeGrid[nx][ny] === 1) {
mazeGrid[x+dir[0]][y+dir[1]] = 0;
mazeGrid[nx][ny] = 0;
x = nx; y = ny;
} else {
x = nx; y = ny;
}
}
}

let thickGrid = JSON.parse(JSON.stringify(mazeGrid));
for(let i=2; i<mazeSize-2; i++) {
for(let j=2; j<mazeSize-2; j++) {
if(mazeGrid[i][j] === 0 && Math.random() < 0.4) {
let thickness = Math.floor(Math.random() * 2) + 1; 
for(let dx=0; dx<=thickness; dx++) {
for(let dz=0; dz<=thickness; dz++) {
if (i+dx < mazeSize-1 && j+dz < mazeSize-1) thickGrid[i+dx][j+dz] = 0;
}
}
}
}
}
mazeGrid = thickGrid;

guaranteedItemCells = [];
for(let r=0; r < 20; r++) {
    let rw = Math.floor(Math.random() * 2) + 1; 
    let rh = Math.floor(Math.random() * 2) + 1; 
    let rx = Math.floor(Math.random() * (mazeSize - rw - 2)) + 2;
    let ry = Math.floor(Math.random() * (mazeSize - rh - 2)) + 2;
    
    for(let i = rx; i < rx + rw; i++) {
        for(let j = ry; j < ry + rh; j++) {
            mazeGrid[i][j] = 0;
        }
    }
    guaranteedItemCells.push({x: rx + Math.floor(rw/2), z: ry + Math.floor(rh/2)});
}

for(let i=0; i<mazeSize; i++) {
mazeGrid[i][0] = 1; mazeGrid[i][mazeSize-1] = 1;
mazeGrid[0][i] = 1; mazeGrid[mazeSize-1][i] = 1;
}

let offset = (mazeSize * cellSize) / 2;
camera.position.set(startX * cellSize - offset + cellSize/2, wallHeight/2, startY * cellSize - offset + cellSize/2);

const wallGeo = new THREE.BoxGeometry(cellSize, wallHeight, cellSize);
const wallMat = new THREE.MeshBasicMaterial({ color: 0x555555 });
let wallCount = 0;
for(let i=0; i<mazeSize; i++) for(let j=0; j<mazeSize; j++) if(mazeGrid[i][j] === 1) wallCount++;

if(instancedWalls) scene.remove(instancedWalls);
colliders = [];
wallData = [];

instancedWalls = new THREE.InstancedMesh(wallGeo, wallMat, wallCount);
let idx = 0;
let dummy = new THREE.Object3D();

for(let i=0; i<mazeSize; i++) {
for(let j=0; j<mazeSize; j++) {
if(mazeGrid[i][j] === 1) {
let isBorder = (i <= 1 || i >= mazeSize - 2 || j <= 1 || j >= mazeSize - 2);
dummy.position.set(i * cellSize - offset + cellSize/2, wallHeight/2, j * cellSize - offset + cellSize/2);
dummy.updateMatrix();
instancedWalls.setMatrixAt(idx, dummy.matrix);
let box = new THREE.Box3().setFromCenterAndSize(dummy.position.clone(), new THREE.Vector3(cellSize, wallHeight, cellSize));
colliders.push(box);
wallData.push({ id: idx, pos: dummy.position.clone(), active: true, box: box, isBorder: isBorder, gridX: i, gridZ: j });
idx++;
}
}
}
scene.add(instancedWalls);

let texLoader = new THREE.TextureLoader();
let availableWalls = wallData.filter(w => !w.isBorder);

for(let t=1; t<=9; t++) {
let tex = texLoader.load(`images/walls/random/texture (${t}).png`);
tex.generateMipmaps = false; 
tex.magFilter = THREE.NearestFilter;
tex.minFilter = THREE.NearestFilter;

for(let k=0; k<2; k++) {
if(availableWalls.length === 0) break;
let rIdx = Math.floor(Math.random() * availableWalls.length);
let w = availableWalls.splice(rIdx, 1)[0];

let texMat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false });
let faceIdx = Math.floor(Math.random() * 4);
let planeGeo = new THREE.PlaneGeometry(cellSize, wallHeight);
let mesh = new THREE.Mesh(planeGeo, texMat);

mesh.position.copy(w.pos);
let offDecal = cellSize / 2 + 0.01;
if(faceIdx === 0) { mesh.position.z += offDecal; }
if(faceIdx === 1) { mesh.position.z -= offDecal; mesh.rotation.y = Math.PI; }
if(faceIdx === 2) { mesh.position.x += offDecal; mesh.rotation.y = Math.PI/2; }
if(faceIdx === 3) { mesh.position.x -= offDecal; mesh.rotation.y = -Math.PI/2; }

scene.add(mesh);
w.customMesh = mesh;
}
}
instancedWalls.instanceMatrix.needsUpdate = true;
}

function getNextPathNode(startPos, endPos) {
let offset = (mazeSize * cellSize) / 2;
let sx = Math.floor((startPos.x + offset) / cellSize);
let sz = Math.floor((startPos.z + offset) / cellSize);
let ex = Math.floor((endPos.x + offset) / cellSize);
let ez = Math.floor((endPos.z + offset) / cellSize);

if(sx === ex && sz === ez) return endPos;

let open = [{x:sx, y:sz}], closed = new Set();
let cameFrom = {}, gScore = {}, fScore = {};
let sKey = sx+','+sz;
gScore[sKey] = 0; fScore[sKey] = Math.abs(sx-ex)+Math.abs(sz-ez);

let searches = 0;
while(open.length > 0 && searches < 400) {
searches++;
open.sort((a,b) => fScore[a.x+','+a.y] - fScore[b.x+','+b.y]);
let curr = open.shift();
let cKey = curr.x+curr.y;

if(curr.x === ex && curr.y === ez) {
let path = [];
while(cameFrom[cKey]) {
path.push(curr);
curr = cameFrom[cKey];
cKey = curr.x+','+curr.y;
}
if(path.length === 0) return endPos;
let nextGrid = path[path.length - 1];
return new THREE.Vector3(nextGrid.x * cellSize - offset + cellSize/2, wallHeight/2, nextGrid.y * cellSize - offset + cellSize/2);
}

closed.add(cKey);
let dirs = [[0,1],[1,0],[0,-1],[-1,0]];
for(let d of dirs) {
let nx = curr.x+d[0], ny = curr.y+d[1];
if(nx<=0||nx>=mazeSize-1||ny<=0||ny>=mazeSize-1||mazeGrid[nx][ny]!==0) continue;
let nKey = nx+','+ny;
if(closed.has(nKey)) continue;

let tg = gScore[cKey] + 1;
if(!gScore[nKey] || tg < gScore[nKey]) {
cameFrom[nKey] = curr;
gScore[nKey] = tg;
fScore[nKey] = tg + Math.abs(nx-ex) + Math.abs(ny-ez);
if(!open.find(p=>p.x===nx&&p.y===ny)) open.push({x:nx, y:ny});
}
}
}
return endPos;
}

function moveEntityWithCollision(entity, moveVec, boxSize, delta) {
if(noClipActive && entity === camera) {
entity.position.addScaledVector(moveVec, delta);
return { hitX: false, hitZ: false };
}
let hitX = false, hitZ = false;

let oldX = entity.position.x;
entity.position.x += moveVec.x * delta;
let eBox = new THREE.Box3().setFromCenterAndSize(entity.position, boxSize);
for(let box of colliders) if(eBox.intersectsBox(box)) { entity.position.x = oldX; hitX = true; break; }

let oldZ = entity.position.z;
entity.position.z += moveVec.z * delta;
eBox.setFromCenterAndSize(entity.position, boxSize);
for(let box of colliders) if(eBox.intersectsBox(box)) { entity.position.z = oldZ; hitZ = true; break; }

return { hitX, hitZ };
}

function updateMonster(delta) {
if(!monsterActive) return;
let dist = monster.position.distanceTo(camera.position);

if (monsterKnockback.lengthSq() > 0.1) {
let hit = moveEntityWithCollision(monster, monsterKnockback, new THREE.Vector3(2.5, 3, 2.5), delta);
if (hit.hitX) monsterKnockback.x = 0;
if (hit.hitZ) monsterKnockback.z = 0;
if (monsterKnockback.x === 0 && monsterKnockback.z === 0) monsterKnockback.set(0,0,0);
return;
}

if(dist > 25) { 
if (!monsterWanderTarget || monster.position.distanceTo(monsterWanderTarget) < 2) {
let rx, rz;
do {
rx = Math.floor(Math.random() * (mazeSize - 2)) + 1;
rz = Math.floor(Math.random() * (mazeSize - 2)) + 1;
} while (mazeGrid[rx][rz] !== 0);
let offset = (mazeSize * cellSize) / 2;
monsterWanderTarget = new THREE.Vector3(rx * cellSize - offset + cellSize/2, wallHeight/2, rz * cellSize - offset + cellSize/2);
}

if (monsterPathTimer <= 0) {
monsterTargetPos = getNextPathNode(monster.position, monsterWanderTarget);
}
let dir = new THREE.Vector3().subVectors(monsterTargetPos, monster.position);
if(dir.lengthSq() < 0.1) dir.copy(new THREE.Vector3().subVectors(camera.position, monster.position));
dir.normalize();

moveEntityWithCollision(monster, dir.multiplyScalar(0.6), new THREE.Vector3(2.5, 3, 2.5), delta);
} else {
monsterWanderTarget = null; 
let dir = new THREE.Vector3().subVectors(camera.position, monster.position).normalize();
monster.position.add(dir.multiplyScalar(blackMonsterSpeed * delta)); 
}

monster.lookAt(camera.position);
monster.children[1].position.x = -0.5 + (Math.random()*0.1 - 0.05);
monster.children[2].position.x = 0.5 + (Math.random()*0.1 - 0.05);

if(dist < 2) triggerDeath();
}

zone.addEventListener('touchstart', (e) => { e.preventDefault(); jTouchId = e.changedTouches[0].identifier; updateJoy(e.changedTouches[0]); }, {passive:false});
zone.addEventListener('touchmove', (e) => {
e.preventDefault();
for(let i=0; i<e.changedTouches.length; i++) if(e.changedTouches[i].identifier === jTouchId) updateJoy(e.changedTouches[i]);
}, {passive:false});
const endJoy = (e) => {
for(let i=0; i<e.changedTouches.length; i++) if(e.changedTouches[i].identifier === jTouchId) {
jTouchId = null; joyMove.x = 0; joyMove.y = 0; knob.style.transform = `translate(-50%, -50%)`;
}

zone.addEventListener('touchend', endJoy); zone.addEventListener('touchcancel', endJoy);
function updateJoy(touch) {
let rect = zone.getBoundingClientRect();
let dx = touch.clientX - (rect.left + rect.width/2), dy = touch.clientY - (rect.top + rect.height/2);
let dist = Math.sqrt(dx*dx + dy*dy), maxD = rect.width/2;
if(dist > maxD) { dx = (dx/dist)*maxD; dy = (dy/dist)*maxD; }
knob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
joyMove.x = dx / maxD; joyMove.y = dy / maxD;
}

let camTouchId = null, lastTouchX = 0, lastTouchY = 0;

camTouchId = t.identifier; lastTouchX = t.clientX; lastTouchY = t.clientY;
}
}
});
document.addEventListener('touchmove', e => {

for(let i=0; i<e.changedTouches.length; i++) {
let t = e.changedTouches[i];
if(t.identifier === camTouchId) {
euler.y -= (t.clientX - lastTouchX) * 0.005 * sensitivity;
if(flyActive) {
euler.x -= (t.clientY - lastTouchY) * 0.005 * sensitivity;
euler.x = Math.max(-Math.PI/2, Math.min(Math.PI/2, euler.x));
}
lastTouchX = t.clientX; lastTouchY = t.clientY;
}
}
});
document.addEventListener('touchend', e => { for(let i=0; i<e.changedTouches.length; i++) if(e.changedTouches[i].identifier === camTouchId) camTouchId = null; });

e.target.innerText = `Соотношение сторон: ${is169Aspect ? '16:9' : '4:3'}`;
};

document.getElementById('adm-fog-density').oninput = (e) => {
let val = parseFloat(e.target.value);
if(scene && scene.fog) scene.fog.density = val;
document.getElementById('adm-val-fog').innerText = val;
};

// --- Кнопки Сброса ---
document.getElementById('adm-reset-pspeed').onclick = () => {
    player.speed = 3.5; player.runMult = 1.8;
    document.getElementById('adm-speed-walk').value = 3.5;
    document.getElementById('adm-val-walk').innerText = "3.5";
    document.getElementById('adm-speed-run').value = 1.8;
    document.getElementById('adm-val-run').innerText = "1.8";
};

document.getElementById('adm-reset-espeed').onclick = () => {
    blackMonsterSpeed = 2.0; dandySpeedVal = 3.4;
    document.getElementById('adm-speed-monster').value = 2.0;
    document.getElementById('adm-val-mSpeed').innerText = "2.0";
    document.getElementById('adm-speed-dandy').value = 3.4;
    document.getElementById('adm-val-dSpeed').innerText = "3.4";
};

document.getElementById('adm-reset-world').onclick = () => {
    fogEnabled = true; if (scene && scene.fog) scene.fog.density = 0.08;
    document.getElementById('adm-fog-density').value = 0.08;
    document.getElementById('adm-val-fog').innerText = "0.08";
    
    pixelated = true; 
    renderer.domElement.style.imageRendering = 'pixelated';
    renderer.setSize(container.clientWidth / 2, container.clientHeight / 2, false);
    document.getElementById('adm-pixel').innerText = `Пикселизация: ВКЛ`;
    
    is169Aspect = false; 
    document.getElementById('game-container').classList.remove('aspect-16-9');
    camera.aspect = 4/3; camera.updateProjectionMatrix();
    document.getElementById('adm-aspect').innerText = `Соотношение сторон: 4:3`;
};

document.getElementById('adm-reset-inv').onclick = () => {
    inv = [null, null, null, null, null];
    activeSlot = 0;
    renderSlotsDOM();
};

document.getElementById('adm-spawn-btn').onclick = () => {
let type = document.getElementById('adm-spawn-select').value;
let spawnPos = camera.position.clone().add(new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion).multiplyScalar(5));

if (type === 'monster') {
  monster.position.copy(spawnPos);
  monster.position.y = wallHeight/2;
  monsterActive = true; monster.visible = true;
} else if (type === 'dandy') {
  spawnDandy();
  if(dandyMesh) dandyMesh.position.copy(spawnPos);
} else if (type === 'lampa') {
  if(!lampa.mesh) initLampa();
  lampa.mesh.position.copy(spawnPos);
  lampa.state = 'idle1';
} else if (type === 'wall' || type === 'tex_wall') {
  let wGeo = new THREE.BoxGeometry(cellSize, wallHeight, cellSize);
  let wMat = new THREE.MeshBasicMaterial({ color: 0x555555 });
  let newWall = new THREE.Mesh(wGeo, wMat);
  newWall.position.copy(spawnPos);
  scene.add(newWall);
  let box = new THREE.Box3().setFromObject(newWall);
  colliders.push(box);

  if (type === 'tex_wall') {
    let tex = new THREE.TextureLoader().load('images/walls/random/texture (1).png');
    tex.magFilter = THREE.NearestFilter;
    let plane = new THREE.Mesh(new THREE.PlaneGeometry(cellSize, wallHeight), new THREE.MeshBasicMaterial({ map: tex, transparent: true }));
    plane.position.copy(spawnPos);
    plane.position.z += cellSize/2 + 0.01;
    scene.add(plane);
  }
}
};

document.getElementById('adm-clear-nearby').onclick = () => {
items.forEach((it, idx) => {
  if(it.position.distanceTo(camera.position) < 10) {
    scene.remove(it); items.splice(idx, 1);
  }
});
if(monsterActive && monster.position.distanceTo(camera.position) < 10) {
  monsterActive = false; monster.visible = false;
}
if(dandyMesh && dandyMesh.position.distanceTo(camera.position) < 10) {
  scene.remove(dandyMesh); dandyMesh = null;
}
};
}

function resizeSlots() {
    let count = inv.length;
    if (count <= 5) {
        document.documentElement.style.setProperty('--slot-size', '40px');
        return;
    }
    let maxW = window.innerWidth * 0.45;
    let maxH = window.innerHeight * 0.5;
    if(maxW < 200) maxW = 200;
    
    let targetArea = (maxW * maxH) / count;
    let s = Math.sqrt(targetArea) - 6; 
    s = Math.min(40, Math.max(8, s));
    document.documentElement.style.setProperty('--slot-size', s + 'px');
}

function renderSlotsDOM() {
const invDiv = document.getElementById('inventory');
invDiv.innerHTML = '';
for(let i=0; i<inv.length; i++) {
let slot = document.createElement('div');
slot.className = 'slot' + (i === activeSlot ? ' active' : '');
slot.id = 'slot-' + i;
invDiv.appendChild(slot);
}
document.getElementById('adm-slot-count').innerText = inv.length;
resizeSlots();
setupSlotEvents();
updateInventoryUI();
}

function startGame() {
gameState = 'playing';
document.getElementById('hud').classList.remove('hidden');
if(bgMusic && bgMusic.buffer && !bgMusic.isPlaying) bgMusic.play();
}

function grabItem() {
for(let i=0; i<items.length; i++) {
if(items[i].position.distanceTo(camera.position) < 4) {
let type = items[i].userData.type;
scene.remove(items[i]); items.splice(i, 1);
if(type === 'key') {
keys++; document.getElementById('key-counter').innerText = `${keys}/${maxKeys}`;
if(keys >= maxKeys) showExit();
} else {
addToInventory({ type: type, uses: type === 'hammer' ? 8 : 1 });
}
break;
}
}
}

function addToInventory(itemObj) { 
for(let i=0; i<inv.length; i++) if(!inv[i]) { inv[i] = itemObj; updateInventoryUI(); return; } 
}

function giveBonbon() {
let given = false;
for(let i=0; i<inv.length; i++) {
if(!inv[i]) { inv[i] = { type: 'bonbon', uses: 1 }; given = true; break; }
}
if(!given) {
inv.push({ type: 'bonbon', uses: 1 });
renderSlotsDOM();
}
updateInventoryUI();
}

function updateInventoryUI() {
for(let i=0; i<inv.length; i++) {
let el = document.getElementById('slot-'+i);
if(el) {
el.className = 'slot' + (i === activeSlot ? ' active' : '');
el.style.background = 'rgba(0,0,0,0.5)';
let imgSrc = inv[i] ? (inv[i].type === 'hammer' ? 'hamer' : inv[i].type) : null;
el.innerHTML = imgSrc ? `<img src="images/${imgSrc}.png">` : ''; 
}
} 
let curItem = inv[activeSlot]; 
if (curItem && curItem.type === 'hammer') { 
document.getElementById('item-name').innerText = `Молоток (${curItem.uses}/8)`;
} else {
document.getElementById('item-name').innerText = curItem ? (itemNames[curItem.type] || curItem.type) : '';
}
}

function useItem() {
let itemObj = inv[activeSlot]; if(!itemObj) return;
let type = itemObj.type;
if(type === 'chocolate') { infiniteStamTime += 15; document.getElementById('stamina-bar').style.background = '#00ffff'; inv[activeSlot] = null; }
else if(type === 'slime') { fireSlime(); inv[activeSlot] = null; }
else if(type === 'hammer') { useHammer(); }
else if(type === 'bonbon') {
bonbonActive = true;
player.speed += 1.0;
setTimeout(() => {
bonbonActive = false;
player.speed -= 1.0;
}, 10000);
inv[activeSlot] = null;
if(activeSlot >= 5) {
inv.splice(activeSlot, 1);
if(activeSlot >= inv.length) activeSlot = 0;
renderSlotsDOM();
}
}
else if(type === 'secret button') {
let emptyCells = [];
for(let i=1; i<mazeSize-1; i++) for(let j=1; j<mazeSize-1; j++) if(mazeGrid[i][j]===0) emptyCells.push({x:i, z:j});
if(emptyCells.length > 0) {
let r = emptyCells[Math.floor(Math.random()*emptyCells.length)];
let offset = (mazeSize * cellSize) / 2;
camera.position.set(r.x * cellSize - offset + cellSize/2, wallHeight/2, r.z * cellSize - offset + cellSize/2);
}
inv[activeSlot] = null;
}
updateInventoryUI();
}

function useHammer() {
let itemObj = inv[activeSlot];
raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
let intersects = raycaster.intersectObject(instancedWalls);
if(intersects.length > 0 && intersects[0].distance < 8) {
let hitPoint = intersects[0].point;

let activeWalls = wallData.filter(w => w.active && !w.isBorder);
activeWalls.sort((a,b) => a.pos.distanceTo(hitPoint) - b.pos.distanceTo(hitPoint));

if(activeWalls.length > 0 && activeWalls[0].pos.distanceTo(hitPoint) < 8) {
let toBreak = activeWalls.slice(0, 3);
toBreak.forEach(w => {
w.active = false;
brokenWalls.push({ id: w.id, scale: 1, pos: w.pos, customMesh: w.customMesh });
let cIdx = colliders.indexOf(w.box);
if(cIdx > -1) colliders.splice(cIdx, 1);
});

itemObj.uses--;
if(itemObj.uses <= 0) {
inv[activeSlot] = null;
}
}
}
}

function fireSlime() {
let slime = new THREE.Sprite(new THREE.SpriteMaterial({ map: globalTextures['slime'] }));
slime.position.copy(camera.position); 
let dir = new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion);
slime.position.add(dir.clone().multiplyScalar(1.0)); 
slime.scale.set(1.5,1.5,1);
scene.add(slime); slimes.push({ mesh: slime, dir: dir, life: 5 });
}

function showExit() {
document.getElementById('message').innerText = "НАЙДИТЕ ВЫХОД";
let maxDist = 0;
let bestCell = null;
let offset = (mazeSize * cellSize) / 2;
for(let i=1; i<mazeSize-1; i++) {
for(let j=1; j<mazeSize-1; j++) {
if(mazeGrid[i][j] === 0) {
let px = i * cellSize - offset + cellSize/2;
let pz = j * cellSize - offset + cellSize/2;
let dist = new THREE.Vector2(px, pz).distanceTo(new THREE.Vector2(camera.position.x, camera.position.z));
if(dist > maxDist) { maxDist = dist; bestCell = {x: px, z: pz}; }
}
}
}

exitMesh = new THREE.Mesh(new THREE.BoxGeometry(cellSize, wallHeight, 1), new THREE.MeshBasicMaterial({ color: 0xffff00 }));
if (bestCell) {
exitMesh.position.set(bestCell.x, wallHeight/2, bestCell.z);
} else {
let dir = new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion);
exitMesh.position.copy(camera.position).add(dir.multiplyScalar(20));
}
scene.add(exitMesh);

dirArrow = new THREE.Mesh(new THREE.ConeGeometry(0.5, 1.5, 8), new THREE.MeshBasicMaterial({color: 0xffff00, depthTest: false}));
scene.add(dirArrow);

monsterActive = false;
monster.visible = false;
spawnDandy();
}

function triggerWin() {
gameState = 'ended';
document.getElementById('hud').classList.add('hidden');
if(dandyAudio && dandyAudio.isPlaying) dandyAudio.stop();
if(bgMusic && bgMusic.isPlaying) bgMusic.stop(); 

let vid = document.getElementById('end-video');
vid.style.display = 'block';
vid.play().catch(e => {
let bs = document.getElementById('black-screen');
bs.style.display = 'block'; bs.style.opacity = '1';
bs.innerHTML = "<h1 style='color:green;text-align:center;margin-top:40vh;'>ВЫ ВЫИГРАЛИ!</h1>";
});

vid.onended = () => {
vid.style.display = 'none';
let bs = document.getElementById('black-screen');
bs.style.display = 'block'; bs.style.opacity = '1';
bs.innerHTML = "<h1 style='color:green;text-align:center;margin-top:40vh;'>ВЫ ВЫИГРАЛИ!</h1>";
};
}

function animate() {
requestAnimationFrame(animate);
let delta = clock.getDelta(); if(delta > 0.1) delta = 0.1;

// Логика ESP
if (monster && monster.children[0]) monster.children[0].material.depthTest = !espMonster;
if (dandyMesh) dandyMesh.material.depthTest = !espDandy;
if (lampa.mesh) lampa.mesh.material.depthTest = !espLampa;

if(gameState === 'playing') {

if (monsterPathTimer > 0) monsterPathTimer -= delta;
else monsterPathTimer = 0.5;

if (lampa.state !== 'dead') {
    let dist = lampa.mesh.position.distanceTo(camera.position);
    if (lampa.state === 'idle1' && dist < 5) {
        lampa.state = 'talking1';
        if (!lampa.audio1.isPlaying) lampa.audio1.play();
    }
    if (lampa.state === 'talking1') {
        if (dist > 25) {
            if (lampa.audio1.isPlaying) lampa.audio1.stop();
            let bs = document.getElementById('black-screen');
            bs.style.display = 'block'; bs.style.opacity = '1';
            setTimeout(() => { bs.style.opacity = '0'; setTimeout(()=>bs.style.display='none', 300); }, 300);
            teleportLampa();
            lampa.state = 'idle1';
        } else if (!lampa.audio1.isPlaying && lampa.audio1.buffer) {
            lampa.state = 'running';
            let runDir = new THREE.Vector3().subVectors(lampa.mesh.position, camera.position).normalize();
            lampa.targetPos.copy(lampa.mesh.position).add(runDir.multiplyScalar(200));
        }
    }
    if (lampa.state === 'running') {
        let dir = new THREE.Vector3().subVectors(lampa.targetPos, lampa.mesh.position).normalize();
        lampa.mesh.position.add(dir.multiplyScalar(delta * 40)); 
        if (lampa.mesh.position.distanceTo(camera.position) > 120 || lampa.mesh.position.distanceTo(lampa.targetPos) < 5) {
            lampa.state = 'idle2';
            snapToNearestEmpty(lampa.mesh.position);
        }
    }
    if (lampa.state === 'idle2' && dist < 5) {
        lampa.state = 'talking2';
        
        if (lampa.hasAudio2) {
            if (lampa.audio2.buffer && !lampa.audio2.isPlaying) lampa.audio2.play();
        } else {
            if(!lampa.bonbonGiven) {
                giveBonbon();
                lampa.bonbonGiven = true;
            }
        }
    }
    
    if (monsterActive && monster.visible && monster.position.distanceTo(lampa.mesh.position) < 5) {
        if (dist < 20 && Math.random() < 0.05) killLampa(); 
    }
    if (dandyMesh && dandyMesh.position.distanceTo(lampa.mesh.position) < 5) {
        killLampa(); 
    }
}

for(let i=0; i<items.length; i++) {
    let isBonbonKey = bonbonActive && items[i].userData.type === 'key';
    if (isBonbonKey) {
        items[i].material.opacity = 1;
        items[i].visible = true;
        items[i].material.depthTest = false;
    } else {
        items[i].material.depthTest = true;
        if (fogEnabled) {
            let dist = items[i].position.distanceTo(camera.position);
            items[i].material.opacity = Math.max(0, 1 - ((dist - 15) / 10));
            items[i].visible = items[i].material.opacity > 0;
        } else {
            items[i].material.opacity = 1;
            items[i].visible = true;
        }
    }
}

for (let i = brokenWalls.length - 1; i >= 0; i--) {
let bw = brokenWalls[i];
bw.scale -= delta * 2;
if (bw.scale <= 0) bw.scale = 0;

if (bw.customMesh) {
bw.customMesh.scale.set(bw.scale, bw.scale, bw.scale);
if (bw.scale <= 0) scene.remove(bw.customMesh);
} 

let dummy = new THREE.Object3D();
dummy.position.copy(bw.pos);
dummy.scale.set(bw.scale, bw.scale, bw.scale);
dummy.updateMatrix();
instancedWalls.setMatrixAt(bw.id, dummy.matrix);

if (bw.scale <= 0) brokenWalls.splice(i, 1);
}
if (brokenWalls.length > 0) instancedWalls.instanceMatrix.needsUpdate = true;

if (exitMesh) {
let t = clock.getElapsedTime();
let intensity = (Math.sin(t * 5) + 1) / 2;
exitMesh.material.color.setRGB(intensity, intensity, 0);

if (dirArrow) {
let forward = new THREE.Vector3(0, -0.5, -3).applyQuaternion(camera.quaternion);
dirArrow.position.copy(camera.position).add(forward);
dirArrow.lookAt(exitMesh.position);
dirArrow.rotateX(Math.PI / 2);
}

let eBox = new THREE.Box3().setFromCenterAndSize(exitMesh.position, new THREE.Vector3(cellSize, wallHeight, 1));
let pBox = new THREE.Box3().setFromCenterAndSize(camera.position, new THREE.Vector3(1, wallHeight, 1));
if (pBox.intersectsBox(eBox)) {
triggerWin();
return;
}
}

if (dandyMesh) {
if (dandyKnockback.lengthSq() > 0.1) {
let hit = moveEntityWithCollision(dandyMesh, dandyKnockback, new THREE.Vector3(2, 3, 2), delta);
if (hit.hitX) dandyKnockback.x = 0;
if (hit.hitZ) dandyKnockback.z = 0;
if (dandyKnockback.x === 0 && dandyKnockback.z === 0) dandyKnockback.set(0,0,0);
} else {
let dist = dandyMesh.position.distanceTo(camera.position);
if (dist <= 35) {
if (monsterPathTimer <= 0) dandyTargetPos = getNextPathNode(dandyMesh.position, camera.position);
let dDir = new THREE.Vector3().subVectors(dandyTargetPos, dandyMesh.position);
if(dDir.lengthSq() < 0.1) dDir.copy(new THREE.Vector3().subVectors(camera.position, dandyMesh.position));
dDir.normalize();
moveEntityWithCollision(dandyMesh, dDir.multiplyScalar(dandySpeedVal), new THREE.Vector3(2, 3, 2), delta);
}
}

if (Math.random() < 0.1) {
dandyMesh.material.map = dandyTextures[Math.floor(Math.random() * 19) + 1];
} else {
dandyMesh.material.map = dandyTextures[0];
}

if (dandyMesh.position.distanceTo(camera.position) < 2) triggerDeath();
}

let currentlyRunning = isRunning && (moveForward || moveBackward || moveLeft || moveRight || joyMove.y !== 0 || joyMove.x !== 0);
if(infiniteStamTime > 0) {
if(currentlyRunning) infiniteStamTime -= delta;
if(infiniteStamTime <= 0) document.getElementById('stamina-bar').style.background = '#00ff00';
} else {
if(currentlyRunning) {
player.stam -= player.stamDrain * delta;
if(player.stam <= 0) { player.stam = 0; currentlyRunning = false; }
} else {
player.stam += player.stamRegen * delta;
if(player.stam > player.maxStam) player.stam = player.maxStam;
}
}
document.getElementById('stamina-bar').style.width = (player.stam / player.maxStam * 100) + '%';

let speed = player.speed * (currentlyRunning ? player.runMult : 1);
direction.z = Number(moveForward) - Number(moveBackward) - joyMove.y;
direction.x = Number(moveRight) - Number(moveLeft) + joyMove.x;

// Обновленная логика передвижения: теперь полёт корректно использует наклон камеры
if (direction.length() > 0 || (flyActive && (moveForward || moveBackward || moveLeft || moveRight || joyMove.x !== 0 || joyMove.y !== 0))) {
    direction.normalize();
    if (flyActive) {
        let flyDir = new THREE.Vector3(direction.x, 0, -direction.z);
        flyDir.applyQuaternion(camera.quaternion);
        camera.position.addScaledVector(flyDir.normalize(), speed * delta);
    } else {
        let moveVec = new THREE.Vector3(direction.x, 0, -direction.z);
        moveVec.applyAxisAngle(new THREE.Vector3(0, 1, 0), euler.y);
        moveEntityWithCollision(camera, moveVec.multiplyScalar(speed), new THREE.Vector3(1.5, wallHeight, 1.5), delta);
    }
}

let targetLookOffset = isLookingBack ? Math.PI : 0;
lookBackOffset += (targetLookOffset - lookBackOffset) * 10 * delta;

let finalEuler = euler.clone();
finalEuler.y += lookBackOffset;
camera.quaternion.setFromEuler(finalEuler);

for(let i=slimes.length-1; i>=0; i--) {
let s = slimes[i]; s.mesh.position.addScaledVector(s.dir, 15 * delta); s.life -= delta;

let hit = false;
if(monsterActive && s.mesh.position.distanceTo(monster.position) < 3) {
monsterKnockback.copy(s.dir).normalize().multiplyScalar(25);
hit = true;
}
if(dandyMesh && s.mesh.position.distanceTo(dandyMesh.position) < 3) {
dandyKnockback.copy(s.dir).normalize().multiplyScalar(25);
hit = true;
}
if(hit || s.life <= 0) { scene.remove(s.mesh); slimes.splice(i, 1); }
}
updateMonster(delta);
}
renderer.render(scene, camera);
}
init();
</script>
</body>
</html>
